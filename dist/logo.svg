<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kbBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d6d"/>
      <stop offset="55%" style="stop-color:#ea2845"/>
      <stop offset="100%" style="stop-color:#ff7a18"/>
    </linearGradient>
    <linearGradient id="kbShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:.25"/>
      <stop offset="45%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#13161d"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#2a303c" stroke-width="2"/>

  <!-- K mark built from the brand gradient -->
  <g fill="url(#kbBrand)">
    <!-- stem -->
    <rect x="34" y="30" width="14" height="68" rx="7"/>
    <!-- upper arm -->
    <path d="M48 70 L78 34 Q82 30 87 30 L92 30 Q99 30 95 37 L68 70 Z"/>
    <!-- lower arm -->
    <path d="M60 62 L92 95 Q96 98 92 98 L86 98 Q81 98 77 94 L48 64 Z"/>
  </g>

  <!-- Layer bars: framework/stack motif -->
  <rect x="34" y="106" width="60" height="4" rx="2" fill="url(#kbBrand)" opacity=".85"/>
  <rect x="42" y="114" width="44" height="4" rx="2" fill="#6b7383" opacity=".6"/>

  <!-- Top highlight -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#kbShine)"/>
</svg>
